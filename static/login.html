<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunCoach — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hanken Grotesk',sans-serif;background:#f2f0ea;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#ffffff;border-radius:16px;padding:40px;width:100%;max-width:360px;border:1px solid #ebe6dc;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.logo{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;color:#23283a;margin-bottom:6px;letter-spacing:-0.3px}
.subtitle{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#a6abb8;letter-spacing:.1em;margin-bottom:32px}
label{display:block;font-size:12px;font-weight:500;color:#8c93a1;margin-bottom:5px}
input{width:100%;padding:10px 14px;border:1px solid #ebe6dc;border-radius:8px;font-size:14px;color:#23283a;background:#faf8f3;margin-bottom:16px;outline:none;transition:border-color .15s;font-family:'Hanken Grotesk',sans-serif}
input:focus{border-color:#5f9c98;background:#fff}
button{width:100%;padding:11px;background:#5f9c98;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:'Hanken Grotesk',sans-serif}
button:hover{background:#437a77}
button:disabled{background:#a6abb8;cursor:not-allowed}
.error{font-size:12px;color:#8b4a42;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">RunCoach</div>
  <div class="subtitle">SIGN IN TO YOUR ACCOUNT</div>
  <form id="login-form" onsubmit="handleLogin(event)">
    <label>Email</label>
    <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
    <button type="submit" id="submit-btn">Sign in</button>
    <div class="error" id="error-msg">Invalid email or password.</div>
  </form>
</div>
<script>
  if (localStorage.getItem('rc_token')) window.location.href = '/';
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn'), err = document.getElementById('error-msg');
    btn.disabled = true; btn.textContent = 'Signing in…'; err.style.display = 'none';
    try {
      const res = await fetch('/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      if (!res.ok) throw new Error();
      const data = await res.json();
      localStorage.setItem('rc_token', data.access_token);
      window.location.href = '/';
    } catch { err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign in'; }
  }
</script>
</body>
</html>
