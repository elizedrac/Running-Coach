<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunCoach — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Stock app palettes (arc dark / workshop light) — deliberately not per-user */
:root{--bg:#030811;--card:#081020;--border:#123252;--ink:#d2f0fc;--muted:#3d648a;--faint:#224058;--field-bg:#0a1728;--accent:#2fd4ff;--accent-dark:#0ea5d9;--accent-rgb:47,212,255;--btn-bg:rgba(47,212,255,.18);--btn-ink:#2fd4ff;--btn-border:rgba(47,212,255,.55);--btn-hover:rgba(47,212,255,.3);--error:#f58878}
@media (prefers-color-scheme:light){
  :root{--bg:#eef1f4;--card:#ffffff;--border:#d8dfe6;--ink:#16232e;--muted:#7c8b98;--faint:#a5b1bc;--field-bg:#f0f3f6;--accent:#0891c9;--accent-dark:#056e9c;--accent-rgb:8,145,201;--btn-bg:#0891c9;--btn-ink:#ffffff;--btn-border:#0891c9;--btn-hover:#056e9c;--error:#8b4a42}
}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:6px;padding:40px;width:100%;max-width:360px;border:1px solid var(--border);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.08),0 4px 32px rgba(0,0,0,.35);position:relative}
.card::before,.card::after{content:'';position:absolute;width:12px;height:12px;pointer-events:none}
.card::before{top:-1px;left:-1px;border-top:2px solid rgba(var(--accent-rgb),.65);border-left:2px solid rgba(var(--accent-rgb),.65)}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid rgba(var(--accent-rgb),.65);border-right:2px solid rgba(var(--accent-rgb),.65)}
.logo{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;color:var(--ink);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 0 18px rgba(var(--accent-rgb),.3)}
.subtitle{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-bottom:32px}
.subtitle::before{content:'// ';color:rgba(var(--accent-rgb),.55)}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--ink);background:var(--field-bg);margin-bottom:16px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:'Hanken Grotesk',sans-serif}
input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14),0 0 12px rgba(var(--accent-rgb),.22)}
button{width:100%;padding:11px;background:var(--btn-bg);color:var(--btn-ink);border:1px solid var(--btn-border);border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:'Hanken Grotesk',sans-serif;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
button:hover{background:var(--btn-hover)}
button:disabled{background:var(--field-bg);color:var(--faint);border-color:var(--border);cursor:not-allowed}
.error{font-size:12px;color:var(--error);margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">RunCoach</div>
  <div class="subtitle">SIGN IN TO YOUR ACCOUNT</div>
  <form id="login-form" onsubmit="handleLogin(event)">
    <label>Email</label>
    <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
    <button type="submit" id="submit-btn">Sign in</button>
    <div class="error" id="error-msg">Invalid email or password.</div>
  </form>
</div>
<script>
  if (localStorage.getItem('rc_token')) window.location.href = '/';
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn'), err = document.getElementById('error-msg');
    btn.disabled = true; btn.textContent = 'Signing in…'; err.style.display = 'none';
    try {
      const res = await fetch('/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      if (!res.ok) throw new Error();
      const data = await res.json();
      localStorage.setItem('rc_token', data.access_token);
      window.location.href = '/';
    } catch { err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign in'; }
  }
</script>
</body>
</html>
