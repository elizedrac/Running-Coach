# Docker's json-file driver is unbounded by default, which fills the disk on a
# small instance. Cap both containers at 30 MB of history.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: runcoach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging: *default-logging

  app:
    build: .
    container_name: runcoach
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
    logging: *default-logging
