# Docker's json-file driver is unbounded by default, which fills the disk on a
# small instance. Cap both containers at 30 MB of history.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: runcoach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging: *default-logging

  app:
    build: .
    container_name: runcoach
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
    logging: *default-logging

  # Tails every container via the Docker socket and ships the lines to Axiom
  # (app.axiom.co), so logs are searchable in a browser instead of over SSH.
  # Outbound HTTPS only, no port exposed. See vector.yaml for the config.
  vector:
    image: timberio/vector:0.58.0-debian
    container_name: runcoach-logs
    restart: unless-stopped
    env_file: .env
    environment:
      # Vector ignores ${VAR} in its config unless this is set, so without it
      # the token and dataset in vector.yaml stay literal and Axiom 401s.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    volumes:
      # Read-only: Vector can read logs, but cannot start or stop containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    logging: *default-logging
